# Kev Scan: iPhone-App für LiDAR-Scans als Grundlage für Kev CAD (Vertrag: SCAN.md im Repo-Wurzelordner).
# Erzeugen und bauen über tools/kevscan.sh; KevScan.xcodeproj ist erzeugt und nicht im Git.
name: KevScan

options:
  bundleIdPrefix: de.upvis
  createIntermediateGroups: true
  developmentLanguage: de
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "2GX7UC98J6"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  KevScan:
    type: application
    platform: iOS
    sources:
      - path: KevScan
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: KevScan
        PRODUCT_BUNDLE_IDENTIFIER: de.upvis.kevscan
        INFOPLIST_FILE: KevScan/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

schemes:
  KevScan:
    build:
      targets:
        KevScan: all
    run:
      config: Debug
    archive:
      config: Release
