<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Kev Scan: Scan-Rahmen mit Drahtgitter-Würfel und Scanlinie. Quelle des App-Symbols (rsvg-convert, siehe tools/kevscan.sh). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18222E"/>
      <stop offset="1" stop-color="#0A0F15"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27C2D9" stop-opacity="0"/>
      <stop offset="1" stop-color="#27C2D9" stop-opacity="0.32"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Ecken des Scan-Rahmens -->
  <g fill="none" stroke="#F2F5F8" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 356 V236 Q196 196 236 196 H356"/>
    <path d="M668 196 H788 Q828 196 828 236 V356"/>
    <path d="M828 668 V788 Q828 828 788 828 H668"/>
    <path d="M356 828 H236 Q196 828 196 788 V668"/>
  </g>
  <!-- Würfel als Drahtgitter -->
  <g fill="none" stroke="#27C2D9" stroke-width="30" stroke-linejoin="round" stroke-linecap="round">
    <path d="M512 330 L672 422 L672 606 L512 698 L352 606 L352 422 Z"/>
    <path d="M352 422 L512 514 L672 422"/>
    <path d="M512 514 L512 698"/>
  </g>
  <!-- Scanlinie mit Lichtfächer -->
  <rect x="256" y="470" width="512" height="90" fill="url(#beam)"/>
  <line x1="256" y1="560" x2="768" y2="560" stroke="#7FE6F2" stroke-width="14" stroke-linecap="round"/>
</svg>
