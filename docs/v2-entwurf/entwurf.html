<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kev CAD V2 Entwurf</title>
<meta name="description" content="Drei Gestaltungsrichtungen für Kev CAD V2 (Graphit, Reißbrett, Sucher) mit je fünf Zuständen.">
<style>
/* ==========================================================================
   Seite um die Bühne (Umschalter), dann die Bühne selbst mit drei Richtungen.
   ========================================================================== */
:root {
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --seite: #26272a;
  --seite-text: #e9e7e3;
  --seite-text2: #9b9994;
  --seite-linie: rgba(255, 255, 255, .1);
  --seite-aktiv: #f2f0ec;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --seite: #dedfe1; --seite-text: #1d1e20; --seite-text2: #5f6166; --seite-linie: rgba(0, 0, 0, .12); --seite-aktiv: #1d1e20; }
}
:root[data-theme="dark"] { --seite: #26272a; --seite-text: #e9e7e3; --seite-text2: #9b9994; --seite-linie: rgba(255, 255, 255, .1); --seite-aktiv: #f2f0ec; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--seite); color: var(--seite-text); font: 13px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }

.kopf { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 14px 20px 10px; }
.kopf-titel { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin-right: auto; }
.kopf-titel b { font-size: 15px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.kopf-titel span { color: var(--seite-text2); }
.schalter { display: flex; flex-wrap: wrap; gap: 2px; padding: 2px; border-radius: 9px; background: var(--seite-linie); }
.schalter button { border: 0; background: none; padding: 6px 11px; border-radius: 7px; cursor: pointer; color: var(--seite-text2); white-space: nowrap; }
.schalter button:hover { color: var(--seite-text); }
.schalter button[aria-pressed="true"] { background: var(--seite-aktiv); color: var(--seite); }
.schalter button:focus-visible { outline: 2px solid #6aa8ff; outline-offset: 1px; }
.kopf-idee { flex-basis: 100%; margin: 0; color: var(--seite-text2); max-width: 980px; }
.kopf-idee b { color: var(--seite-text); font-weight: 600; }
.rahmen { padding: 6px 20px 28px; }
.buehne-halter { position: relative; margin: 0 auto; overflow: hidden; border-radius: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 18px 50px rgba(0, 0, 0, .35); }
.buehne-halter > .buehne { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
@media (max-width: 640px) { .kopf { padding: 12px 16px 8px; } .rahmen { padding: 6px 16px 20px; } .buehne-halter { border-radius: 8px; } }
.ohne-webgl { position: absolute; inset: auto 16px 16px auto; padding: 8px 12px; background: #000c; color: #fff; border-radius: 8px; font-size: 12px; z-index: 50; }

/* Nur Bühne (für Bilder) und Übersicht */
body.nur-buehne .kopf { display: none; }
body.nur-buehne { background: #000; overflow: hidden; }
body.nur-buehne .rahmen { padding: 0; }
body.nur-buehne .buehne-halter { width: 1440px; height: 900px; margin: 0; border-radius: 0; box-shadow: none; }
body.nur-buehne #buehne { border-radius: 0; box-shadow: none; transform: none; }
.uebersicht { display: none; }
body.zeige-uebersicht .kopf, body.zeige-uebersicht .rahmen { display: none; }
body.zeige-uebersicht { background: #202124; }
body.zeige-uebersicht .uebersicht { display: grid; grid-template-columns: repeat(3, 720px); gap: 24px; padding: 24px; }
.uebersicht figure { margin: 0; }
.uebersicht figcaption { color: #ecebe8; font: 600 15px/1.3 var(--sans); padding: 0 2px 10px; display: flex; gap: 10px; align-items: baseline; }
.uebersicht figcaption span { color: #9d9b97; font-weight: 400; font-size: 13px; }
.uebersicht .zelle { position: relative; width: 720px; height: 450px; border-radius: 10px; overflow: hidden; }
.uebersicht .zelle > .buehne { transform: scale(.5); transform-origin: 0 0; position: absolute; }

/* ==========================================================================
   Bühne: gemeinsame Bausteine
   ========================================================================== */
.buehne { position: relative; width: 1440px; height: 900px; overflow: hidden; font: 13px/1.4 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-variant-numeric: tabular-nums; }
.buehne * { box-sizing: border-box; }
.buehne svg { overflow: visible; }
.vp { position: absolute; overflow: hidden; }
.v3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ueber { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.marken { position: absolute; inset: 0; pointer-events: none; }
.marke { position: absolute; white-space: nowrap; }
.ampel { display: flex; gap: 8px; }
.ampel i { width: 12px; height: 12px; border-radius: 50%; display: block; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .28); }
.ampel i:nth-child(2) { background: #febc2e; }
.ampel i:nth-child(3) { background: #28c840; }
.ikon { width: 16px; height: 16px; display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.still *, .still *::before, .still *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { .buehne *, .buehne *::before, .buehne *::after { animation: none !important; transition: none !important; } }
@keyframes atmen { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
@keyframes pegel { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
@keyframes blinken { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes ring { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.8); opacity: 0; } }

/* Desktop im Zustand c (schmal am Rand) */
.desk { position: absolute; inset: 0; }
.chat { position: absolute; left: 16px; top: 16px; bottom: 16px; width: 936px; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.chat-kopf { height: 46px; display: flex; align-items: center; gap: 16px; padding: 0 16px; flex: none; }
.chat-kopf b { font-weight: 600; font-size: 13px; }
.chat-verlauf { flex: 1; padding: 26px 64px; display: flex; flex-direction: column; gap: 18px; overflow: hidden; }
.chat-du { align-self: flex-end; max-width: 560px; padding: 10px 14px; border-radius: 16px 16px 4px 16px; font-size: 14px; line-height: 1.45; }
.chat-er { max-width: 640px; font-size: 14px; line-height: 1.55; }
.chat-er p { margin: 0 0 8px; }
.chat-eingabe { margin: 0 64px 22px; height: 46px; border-radius: 23px; display: flex; align-items: center; padding: 0 18px; gap: 10px; font-size: 14px; flex: none; }
.chat-eingabe span { flex: 1; }
.schmal { position: absolute; right: 12px; top: 16px; bottom: 16px; width: 460px; border-radius: 12px; overflow: hidden; }

/* ==========================================================================
   Richtung Graphit: Der Viewer als Fotostudio. Die Oberfläche tritt zurück,
   Text steht direkt im Bild. Kevin spricht in Lichtblau, der Agent in Messing.
   ========================================================================== */
.r-graphit {
  --g-hell: #4a4d53; --g-mitte: #2e3034; --g-tief: #191a1d;
  --g-kreide: #efede9; --g-asche: #a9a7a2; --g-rauch: #77756f;
  --g-blau: #8fc6ff; --g-messing: #dcb878; --g-koralle: #ff7b69;
  --g-insel: rgba(31, 32, 35, .74); --g-linie: rgba(255, 255, 255, .075); --g-feld: rgba(255, 255, 255, .055);
  color: var(--g-kreide);
  background: radial-gradient(120% 95% at 56% 40%, var(--g-hell) 0%, var(--g-mitte) 44%, var(--g-tief) 100%);
}
.r-graphit .schatten-t { text-shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 0 18px rgba(0, 0, 0, .25); }
.g-oben { position: absolute; left: 20px; top: 16px; display: flex; align-items: center; gap: 18px; z-index: 5; }
.g-projekt { font-size: 13px; font-weight: 600; letter-spacing: -.005em; display: flex; align-items: center; gap: 6px; }
.g-projekt small { font-weight: 400; color: var(--g-rauch); font-size: 12px; }
.g-modus { display: flex; padding: 2px; border-radius: 999px; background: rgba(255, 255, 255, .06); }
.g-modus span { padding: 4px 11px; border-radius: 999px; font-size: 12px; color: var(--g-asche); }
.g-modus span.an { background: rgba(255, 255, 255, .13); color: var(--g-kreide); }
.g-aktionen { position: absolute; right: 18px; top: 12px; display: flex; gap: 8px; z-index: 5; }
.g-knopf { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .065); color: rgba(239, 237, 233, .88); corner-shape: squircle; }
.g-knopf .rec { width: 11px; height: 11px; border-radius: 50%; background: var(--g-koralle); box-shadow: 0 0 0 3px rgba(255, 123, 105, .18); }
.g-liste { position: absolute; left: 22px; top: 92px; width: 212px; z-index: 4; font-size: 13px; }
.g-zeile { display: flex; align-items: center; height: 27px; color: rgba(239, 237, 233, .86); gap: 8px; }
.g-zeile b { font-weight: 450; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-zeile em { font-style: normal; color: var(--g-rauch); font-size: 12px; }
.g-zeile .pfeil { width: 10px; color: var(--g-rauch); display: grid; place-items: center; }
.g-zeile .pfeil .ikon { width: 10px; height: 10px; stroke-width: 2; }
.g-zeile.befund::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--g-koralle); }
.g-zeile.kind { padding-left: 17px; height: 25px; font-size: 12.5px; color: var(--g-asche); }
.g-zeile.markiert { color: var(--g-blau); }
.g-zeile.markiert::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--g-blau); box-shadow: 0 0 8px var(--g-blau); }
.g-zeile.gewaehlt { background: rgba(143, 198, 255, .13); border-radius: 7px; color: var(--g-kreide); margin: 0 -8px; padding-right: 8px; }
.g-zeile.gewaehlt.kind { padding-left: 25px; }

.g-untertitel { position: absolute; left: 50%; transform: translateX(-50%); bottom: 64px; width: 860px; text-align: center; z-index: 6; }
.g-status { display: inline-flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--g-blau); margin-bottom: 12px; }
.g-pegel { display: flex; gap: 3px; align-items: center; height: 16px; }
.g-pegel i { width: 3px; height: 16px; border-radius: 2px; background: var(--g-blau); transform-origin: center; animation: pegel 1s ease-in-out infinite; }
.g-pegel i:nth-child(2) { animation-delay: -.3s; } .g-pegel i:nth-child(3) { animation-delay: -.6s; } .g-pegel i:nth-child(4) { animation-delay: -.15s; } .g-pegel i:nth-child(5) { animation-delay: -.45s; }
.still .g-pegel i:nth-child(1) { transform: scaleY(.45); } .still .g-pegel i:nth-child(2) { transform: scaleY(.8); } .still .g-pegel i:nth-child(3) { transform: scaleY(1); } .still .g-pegel i:nth-child(4) { transform: scaleY(.6); } .still .g-pegel i:nth-child(5) { transform: scaleY(.35); }
.g-text { font-size: 27px; line-height: 1.34; font-weight: 400; letter-spacing: -.012em; color: var(--g-kreide); text-wrap: balance; }
.g-text .laeuft { color: var(--g-rauch); }
.g-text .cursor { display: inline-block; width: 2px; height: 1.05em; background: var(--g-blau); vertical-align: -.16em; margin-left: 3px; animation: blinken 1s steps(1) infinite; }
.g-dabei { margin-top: 12px; font-size: 12px; color: var(--g-asche); }
.g-dabei b { color: var(--g-kreide); font-weight: 500; }
.g-hinweise { position: absolute; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; gap: 22px; font-size: 12px; color: var(--g-asche); z-index: 6; }
.g-hinweise span { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.r-graphit kbd { font: 500 11px/1 var(--sans); min-width: 20px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center; border-radius: 6px; color: var(--g-kreide); background: rgba(255, 255, 255, .08); box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .14), 0 1px 0 rgba(0, 0, 0, .35); }
.g-spur { position: absolute; right: 26px; bottom: 96px; width: 310px; z-index: 5; font-size: 12.5px; }
.g-spur h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--g-messing); }
.g-spur ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.g-spur li { display: grid; grid-template-columns: 16px 1fr; gap: 6px; color: var(--g-asche); line-height: 1.35; }
.g-spur li::before { content: ""; width: 9px; height: 5px; border-left: 1.5px solid var(--g-messing); border-bottom: 1.5px solid var(--g-messing); transform: rotate(-45deg) translate(1px, 3px); opacity: .9; }
.g-spur li.alt { opacity: .5; }
.g-spur li.befund { color: var(--g-kreide); }
.g-spur li.befund::before { border: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--g-koralle); transform: translate(1px, 5px); }
.g-spur li.jetzt { color: var(--g-messing); }
.g-spur li.jetzt::before { border: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--g-messing); transform: translate(1px, 5px); animation: atmen 1.6s ease-in-out infinite; }
/* Marken im Bild */
.g-mass { font-size: 12px; font-weight: 600; color: #2a2116; background: var(--g-messing); padding: 2px 7px; border-radius: 6px; transform: translate(-50%, -50%); box-shadow: 0 2px 10px rgba(0, 0, 0, .35); }
.g-mass.leise { background: rgba(26, 27, 30, .82); color: var(--g-messing); box-shadow: inset 0 0 0 1px rgba(220, 184, 120, .45); }
.g-zeiger { font-size: 12px; color: var(--g-kreide); background: rgba(24, 25, 28, .82); padding: 4px 9px; border-radius: 8px; display: flex; gap: 7px; align-items: center; box-shadow: 0 4px 16px rgba(0, 0, 0, .3); }
.g-zeiger::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--g-blau); }
.g-befund { font-size: 12px; color: var(--g-kreide); background: rgba(24, 25, 28, .84); padding: 6px 10px 6px 9px; border-radius: 9px; display: flex; gap: 8px; align-items: center; box-shadow: inset 0 0 0 1px rgba(255, 123, 105, .45), 0 4px 16px rgba(0, 0, 0, .3); }
.g-befund b { color: var(--g-koralle); font-weight: 600; }
.g-puls { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 1.5px solid var(--g-koralle); }
.g-puls::after { content: ""; position: absolute; inset: -1.5px; border-radius: 50%; border: 1.5px solid var(--g-koralle); animation: ring 1.8s ease-out infinite; }
.still .g-puls::after { display: none; }

/* Graphit: Werkstatt */
.g-spalte { position: absolute; left: 14px; top: 58px; bottom: 14px; width: 278px; border-radius: 18px; background: var(--g-insel); box-shadow: inset 0 0 0 1px var(--g-linie); padding: 14px 16px; display: flex; flex-direction: column; gap: 18px; overflow: hidden; corner-shape: squircle; }
.g-spalte .g-liste { position: static; width: auto; }
.g-abschnitt h4 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--g-asche); display: flex; justify-content: space-between; }
.g-abschnitt h4 span { font-weight: 400; color: var(--g-rauch); }
.g-name { font-size: 17px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.g-name .ikon { color: var(--g-rauch); width: 14px; height: 14px; }
.g-felder { display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; align-items: center; font-size: 12.5px; }
.g-felder dt { color: var(--g-asche); }
.g-felder dd { margin: 0; height: 26px; border-radius: 7px; background: var(--g-feld); display: flex; align-items: center; justify-content: space-between; padding: 0 9px; color: var(--g-kreide); }
.g-felder dd small { color: var(--g-rauch); font-size: 11.5px; }
.g-felder dd.neu { box-shadow: inset 0 0 0 1px rgba(220, 184, 120, .55); }
.g-felder dd.neu small { color: var(--g-messing); }
.g-reihe { display: flex; gap: 8px; margin-top: 12px; }
.g-reihe span { flex: 1; height: 28px; border-radius: 8px; background: rgba(255, 255, 255, .075); display: grid; place-items: center; font-size: 12px; color: var(--g-kreide); }
.g-kacheln { position: absolute; left: 304px; right: 14px; top: 58px; bottom: 76px; }
.g-kachel { position: absolute; border-radius: 18px; background: rgba(255, 255, 255, .03); box-shadow: inset 0 0 0 1px var(--g-linie); overflow: hidden; corner-shape: squircle; }
.g-kachel.modell { background: radial-gradient(110% 90% at 55% 38%, rgba(255, 255, 255, .07), rgba(255, 255, 255, .0) 60%), rgba(255, 255, 255, .02); }
.g-kachel > header { position: absolute; left: 0; right: 0; top: 0; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; z-index: 3; }
.g-kachel > header b { font-size: 13px; font-weight: 600; }
.g-kachel > header span { color: var(--g-rauch); font-size: 12px; flex: 1; }
.g-kachel > header .ikon { color: var(--g-rauch); width: 15px; height: 15px; }
.g-kachel .vp { left: 0; right: 0; top: 0; bottom: 0; }
.g-papier { position: absolute; left: 12px; right: 12px; top: 42px; bottom: 12px; border-radius: 8px; background: #f1f0ec; overflow: hidden; }
.g-tabelle { position: absolute; left: 6px; right: 6px; top: 42px; bottom: 6px; font-size: 12px; }
.g-tabelle table { width: 100%; border-collapse: collapse; }
.g-tabelle th { text-align: left; font-weight: 500; color: var(--g-rauch); font-size: 11.5px; padding: 0 8px 6px; }
.g-tabelle td { padding: 0 8px; height: 20px; color: rgba(239, 237, 233, .88); white-space: nowrap; }
.g-tabelle tbody tr:nth-child(odd) td { background: rgba(255, 255, 255, .025); }
.g-tabelle td:first-child, .g-tabelle th:first-child { text-align: right; width: 34px; color: var(--g-rauch); }
.g-tabelle td.n { text-align: right; width: 44px; }
.g-tabelle td.m { color: var(--g-asche); }
.g-tabelle tr.neu td { color: var(--g-messing); }
.g-tabelle tfoot td { color: var(--g-asche); padding-top: 8px; height: 30px; }
.g-tabelle tfoot b { color: var(--g-kreide); font-weight: 600; }
.g-sprech { position: absolute; left: 304px; right: 14px; bottom: 14px; height: 50px; display: flex; align-items: center; gap: 14px; padding: 0 16px; }
.g-mikro { display: flex; align-items: center; gap: 9px; height: 36px; padding: 0 14px 0 6px; border-radius: 999px; background: rgba(255, 255, 255, .07); font-size: 12.5px; color: var(--g-kreide); white-space: nowrap; }
.g-mikro i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(143, 198, 255, .16); color: var(--g-blau); }
.g-zuletzt { font-size: 12.5px; color: var(--g-asche); flex: 1; min-width: 0; display: flex; gap: 16px; white-space: nowrap; overflow: hidden; }
.g-zuletzt q { color: var(--g-blau); quotes: "„" "“"; }
.g-zuletzt .agent { color: var(--g-messing); overflow: hidden; text-overflow: ellipsis; }

/* Graphit: schmal, Start, Tasten */
.r-graphit .desk { background: radial-gradient(90% 90% at 70% 30%, #34363b, #1c1d20); }
.r-graphit .chat { background: #232427; box-shadow: 0 0 0 .5px rgba(255, 255, 255, .12), 0 20px 50px rgba(0, 0, 0, .45); color: #e8e6e2; }
.r-graphit .chat-kopf { border-bottom: 1px solid rgba(255, 255, 255, .06); }
.r-graphit .chat-du { background: #3a3c41; }
.r-graphit .chat-er { color: #d9d7d3; }
.r-graphit .chat-eingabe { background: #2e3034; color: #8f8d89; }
.r-graphit .schmal { background: radial-gradient(130% 90% at 50% 38%, var(--g-hell) 0%, var(--g-mitte) 46%, var(--g-tief) 100%); box-shadow: 0 0 0 .5px rgba(255, 255, 255, .14), 0 20px 50px rgba(0, 0, 0, .5); }
.schmal .g-oben { left: 16px; top: 14px; gap: 12px; }
.schmal .g-aktionen { right: 12px; top: 10px; }
.g-schmal-unten { position: absolute; left: 16px; right: 16px; bottom: 14px; z-index: 6; display: grid; gap: 10px; }
.g-agentzeile { font-size: 13px; color: var(--g-messing); display: flex; align-items: center; gap: 8px; }
.g-agentzeile::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--g-messing); animation: atmen 1.6s ease-in-out infinite; }
.g-agentzeile small { color: var(--g-rauch); font-size: 12px; margin-left: auto; }
.g-leise { color: var(--g-rauch); font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
.g-start { position: absolute; left: 0; right: 0; top: 250px; text-align: center; z-index: 3; }
.g-start h2 { margin: 0; font-size: 38px; font-weight: 300; letter-spacing: -.02em; color: rgba(239, 237, 233, .94); }
.g-start p { margin: 12px 0 0; font-size: 15px; color: var(--g-asche); }
.g-start p kbd { margin: 0 2px; }
.g-regal { position: absolute; left: 50%; transform: translateX(-50%); bottom: 22px; width: 1124px; border-radius: 22px; background: rgba(28, 29, 32, .8); box-shadow: inset 0 0 0 1px var(--g-linie), 0 30px 70px rgba(0, 0, 0, .45); padding: 16px 18px 18px; z-index: 7; corner-shape: squircle; backdrop-filter: blur(18px); }

.g-karte b { display: block; font-size: 13px; font-weight: 600; }

.g-regal footer { margin-top: 12px; font-size: 12px; color: var(--g-rauch); text-align: center; }
.g-schleier { position: absolute; inset: 0; background: rgba(17, 18, 20, .5); z-index: 6; backdrop-filter: blur(3px); }
.g-tasten { position: absolute; left: 50%; top: 66px; transform: translateX(-50%); width: 1060px; border-radius: 26px; background: rgba(33, 34, 37, .9); box-shadow: inset 0 0 0 1px var(--g-linie), 0 40px 90px rgba(0, 0, 0, .5); padding: 26px 30px 24px; z-index: 7; corner-shape: squircle; }
.g-tasten header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; }

.g-tgruppen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px 34px; }

.r-graphit .g-hinweise.hervor { bottom: 14px; padding: 9px 18px; left: 50%; right: auto; transform: translateX(-50%); border-radius: 14px; background: rgba(24, 25, 28, .86); box-shadow: inset 0 0 0 1px rgba(220, 184, 120, .4); }

/* ==========================================================================
   Richtung Reißbrett: Arbeiten wie am Zeichenbrett. Helles Blatt, Tusche,
   Kevin markiert mit Rotstift, der Agent antwortet in Blau und trägt jede
   Änderung mit Index ein. Befunde sind gelb schraffiert.
   ========================================================================== */
.r-reiss {
  --p-papier: #eceff2; --p-bogen: #ffffff; --p-raster: #dbe2e8; --p-tusche: #16202b; --p-blei: #5a6673; --p-blei2: #8b96a1;
  --p-rot: #d23b2e; --p-blau: #2856c4; --p-gelb: #f0b400; --p-linie: #c8d0d8;
  color: var(--p-tusche); background: var(--p-papier);
}
.p-kopf { position: absolute; left: 0; right: 0; top: 0; height: 46px; display: flex; align-items: center; gap: 20px; padding: 0 16px 0 20px; }
.p-kopf .p-projekt { font-weight: 600; font-size: 13px; }
.p-kopf .p-projekt small { font-weight: 400; color: var(--p-blei2); margin-left: 6px; font-size: 12px; }
.p-tabs { display: flex; gap: 16px; height: 46px; align-items: stretch; }
.p-tabs span { display: flex; align-items: center; font-size: 12.5px; color: var(--p-blei); box-shadow: inset 0 -2px 0 transparent; }
.p-tabs span.an { color: var(--p-tusche); box-shadow: inset 0 -2px 0 var(--p-tusche); font-weight: 500; }
.p-werkzeuge { margin-left: auto; display: flex; gap: 4px; }
.p-werkzeuge span { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border-radius: 4px; font-size: 12.5px; color: var(--p-blei); }
.p-werkzeuge span .ikon { width: 15px; height: 15px; color: var(--p-tusche); }
.p-werkzeuge .rec { width: 9px; height: 9px; border-radius: 50%; background: var(--p-rot); }
.p-blatt { position: absolute; left: 14px; right: 14px; top: 48px; bottom: 46px; background: var(--p-bogen); box-shadow: 0 0 0 1px rgba(22, 32, 43, .08), 0 1px 3px rgba(22, 32, 43, .08); }
.p-rand { position: absolute; inset: 14px; border: 1.4px solid var(--p-tusche); pointer-events: none; z-index: 2; }
.p-zonen { position: absolute; inset: 0; pointer-events: none; z-index: 2; font: 9.5px/1 var(--mono); color: var(--p-blei2); }
.p-zonen span { position: absolute; }
.p-blatt .vp { left: 15px; top: 15px; right: 15px; bottom: 15px; }
.p-baum { position: absolute; left: 34px; top: 34px; width: 214px; z-index: 4; font-size: 12.5px; }
.p-baum h4 { margin: 0 0 6px; font-size: 11.5px; font-weight: 600; color: var(--p-blei); display: flex; justify-content: space-between; }
.p-baum h4 span { font: 10.5px var(--mono); color: var(--p-blei2); font-weight: 400; }
.p-knoten { position: relative; display: flex; align-items: center; height: 24px; padding-left: 16px; gap: 6px; }
.p-knoten::before { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; border-left: 1px solid var(--p-linie); }
.p-knoten::after { content: ""; position: absolute; left: 4px; top: 12px; width: 8px; border-top: 1px solid var(--p-linie); }
.p-knoten:last-child::before { bottom: 12px; }
.p-knoten b { font-weight: 450; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-knoten em { font: 10.5px var(--mono); font-style: normal; color: var(--p-blei2); }
.p-knoten.kind { margin-left: 16px; font-size: 12px; color: var(--p-blei); height: 22px; }
.p-knoten.kind::after { top: 11px; }
.p-knoten.markiert { color: var(--p-rot); }
.p-knoten.markiert b { font-weight: 550; }
.p-knoten.markiert b::after { content: ""; display: block; height: 1.5px; margin-top: 1px; width: 92%; background: var(--p-rot); opacity: .75; border-radius: 1px; transform: rotate(-.6deg); }
.p-knoten.gewaehlt { background: #fdecea; }
.p-knoten.gewaehlt b { color: var(--p-rot); }
.p-notiz { position: absolute; right: 34px; top: 40px; width: 302px; z-index: 4; }
.p-notiz-kopf { display: flex; align-items: center; gap: 8px; color: var(--p-rot); font-size: 11.5px; font-weight: 600; margin-bottom: 8px; }
.p-welle { display: flex; gap: 2px; align-items: center; height: 14px; }
.p-welle i { width: 2px; height: 14px; background: var(--p-rot); border-radius: 1px; animation: pegel 1.1s ease-in-out infinite; }
.p-welle i:nth-child(2) { animation-delay: -.4s; } .p-welle i:nth-child(3) { animation-delay: -.7s; } .p-welle i:nth-child(4) { animation-delay: -.2s; }
.still .p-welle i:nth-child(1) { transform: scaleY(.5); } .still .p-welle i:nth-child(2) { transform: scaleY(1); } .still .p-welle i:nth-child(3) { transform: scaleY(.7); } .still .p-welle i:nth-child(4) { transform: scaleY(.4); }
.p-handschrift { font-size: 20px; line-height: 1.42; font-style: italic; color: var(--p-rot); letter-spacing: -.005em; }
.p-handschrift .laeuft { opacity: .5; }
.p-handschrift .cursor { display: inline-block; width: 1.5px; height: 1em; background: var(--p-rot); vertical-align: -.12em; margin-left: 2px; animation: blinken 1s steps(1) infinite; }
.p-beilagen { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--p-linie); font-size: 12px; color: var(--p-blei); display: grid; gap: 3px; }
.p-beilagen b { color: var(--p-tusche); font-weight: 500; }
.p-tasten-jetzt { margin-top: 10px; display: flex; gap: 14px; font-size: 12px; color: var(--p-blei); }
.r-reiss kbd { font: 500 10.5px/1 var(--mono); min-width: 19px; height: 19px; padding: 0 5px; display: inline-grid; place-items: center; border: 1px solid var(--p-tusche); border-bottom-width: 2px; border-radius: 3px; color: var(--p-tusche); background: #fff; margin-right: 5px; }
.p-aenderungen { position: absolute; right: 34px; bottom: 112px; width: 382px; z-index: 4; font-size: 12px; background: var(--p-bogen); }
.p-aenderungen table, .p-schriftfeld table { width: 100%; border-collapse: collapse; }
.p-aenderungen caption { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--p-blei); padding-bottom: 5px; }
.p-aenderungen td { border: 1px solid var(--p-tusche); padding: 0 7px; height: 21px; white-space: nowrap; }
.p-aenderungen td:first-child { width: 26px; text-align: center; font: 11px var(--mono); color: var(--p-blau); }
.p-aenderungen td:last-child { width: 30px; text-align: center; color: var(--p-blau); font-weight: 600; }
.p-aenderungen tr.befund td:last-child { color: #9a6c00; }
.p-aenderungen tr.befund td:nth-child(2) { background: repeating-linear-gradient(-45deg, rgba(240, 180, 0, .22) 0 4px, transparent 4px 8px); }
.p-aenderungen tr.jetzt td { color: var(--p-blau); font-style: italic; }
.p-schriftfeld { position: absolute; right: 29px; bottom: 29px; width: 392px; z-index: 4; background: var(--p-bogen); font-size: 11px; }
.p-schriftfeld td { border: 1px solid var(--p-tusche); padding: 3px 7px; vertical-align: top; height: 34px; }
.p-schriftfeld td small { display: block; font-size: 9.5px; color: var(--p-blei2); margin-bottom: 1px; }
.p-schriftfeld td b { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.p-schriftfeld td span { font-family: var(--mono); font-size: 11px; }
.p-legende { position: absolute; left: 20px; right: 20px; bottom: 0; height: 46px; display: flex; align-items: center; gap: 20px; font-size: 12px; color: var(--p-blei); }
.p-legende strong { color: var(--p-tusche); font-weight: 600; font-size: 11.5px; }
.p-legende span { display: inline-flex; align-items: center; }
.p-legende .rechts { margin-left: auto; }
/* Marken im Bild */
.p-mass { font: 12px/1 var(--mono); color: var(--p-blau); background: rgba(255, 255, 255, .92); padding: 1px 3px; transform: translate(-50%, -50%); }
.p-mass.senkrecht { transform: translate(-50%, -50%) rotate(-90deg); }
.p-hinweis { font-size: 12px; color: var(--p-blau); background: rgba(255, 255, 255, .94); padding: 2px 5px; }
.p-hinweis.rot { color: var(--p-rot); }
.p-befund { font-size: 12px; color: var(--p-tusche); background: var(--p-gelb); padding: 5px 9px 5px 7px; display: flex; align-items: center; gap: 7px; box-shadow: 0 0 0 1px var(--p-tusche); }
.p-befund svg { width: 15px; height: 15px; }

/* Reißbrett: Werkstatt (Leuchttisch) */
.p-seite { position: absolute; left: 14px; top: 52px; bottom: 50px; width: 284px; display: flex; flex-direction: column; gap: 20px; }
.p-seite .p-baum { position: static; width: auto; }
.p-form h4 { margin: 0 0 8px; font-size: 11.5px; font-weight: 600; color: var(--p-blei); display: flex; justify-content: space-between; }
.p-form h4 span { font: 10.5px var(--mono); color: var(--p-blei2); font-weight: 400; }
.p-form .p-name { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; color: var(--p-rot); }
.p-form .p-name .ikon { width: 14px; height: 14px; color: var(--p-blei2); }
.p-form dl { margin: 0; display: grid; grid-template-columns: 98px 1fr; gap: 0 10px; font-size: 12.5px; }
.p-form dt { color: var(--p-blei); height: 26px; display: flex; align-items: center; }
.p-form dd { margin: 0; height: 26px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--p-linie); font-family: var(--mono); font-size: 12px; }
.p-form dd s { color: var(--p-blei2); }
.p-form dd .delta { margin-left: auto; color: var(--p-blau); font-size: 10.5px; display: inline-flex; align-items: center; gap: 2px; }
.p-form dd.neu { color: var(--p-blau); }
.p-knoepfe { display: flex; gap: 8px; margin-top: 12px; }
.p-knoepfe span { flex: 1; height: 28px; border: 1px solid var(--p-tusche); border-radius: 3px; display: grid; place-items: center; font-size: 12px; background: #fff; }
.p-tisch { position: absolute; left: 312px; right: 14px; top: 52px; bottom: 50px; }
.p-bogen { position: absolute; background: var(--p-bogen); box-shadow: 0 0 0 1px rgba(22, 32, 43, .1), 0 2px 4px rgba(22, 32, 43, .06), 0 14px 30px rgba(22, 32, 43, .07); }
.p-bogen > header { position: absolute; left: 0; right: 0; top: 0; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 14px; z-index: 3; border-bottom: 1px solid var(--p-linie); background: #fff; }
.p-bogen > header b { font-size: 12px; font-weight: 600; }
.p-bogen > header span { font-size: 11.5px; color: var(--p-blei2); flex: 1; }
.p-bogen > header .ikon { width: 14px; height: 14px; color: var(--p-blei); }
.p-bogen .vp { left: 0; right: 0; top: 33px; bottom: 0; }
.p-titelstreifen { position: absolute; left: 0; right: 0; bottom: 0; height: 25px; display: flex; border-top: 1.2px solid var(--p-tusche); font: 10.5px/1 var(--mono); color: var(--p-tusche); background: #fff; z-index: 3; }
.p-titelstreifen span { display: flex; align-items: center; padding: 0 8px; border-left: 1px solid var(--p-tusche); white-space: nowrap; }
.p-titelstreifen span:first-child { border-left: 0; flex: 1; font-family: var(--sans); font-size: 11.5px; }
.p-titelstreifen .tn { font-style: normal; }
.p-titelstreifen b { font-weight: 600; }
.p-stueckliste { position: absolute; left: 14px; right: 14px; top: 44px; bottom: 12px; font-size: 11.5px; }
.p-stueckliste table { width: 100%; border-collapse: collapse; }
.p-stueckliste th { font-size: 10.5px; font-weight: 600; text-align: left; border: 1px solid var(--p-tusche); padding: 3px 6px; background: #f6f7f8; }
.p-stueckliste td { border: 1px solid var(--p-tusche); border-top-color: var(--p-linie); border-bottom-color: var(--p-linie); padding: 0 6px; height: 20.5px; white-space: nowrap; }
.p-stueckliste td.n, .p-stueckliste td.pos { text-align: right; font-family: var(--mono); font-size: 11px; }
.p-stueckliste td.m { font-family: var(--mono); font-size: 11px; color: var(--p-blei); }
.p-stueckliste tr.neu td { color: var(--p-blau); }
.p-stueckliste tfoot td { border: 1px solid var(--p-tusche); height: 24px; font-weight: 600; }
.p-sprech { position: absolute; left: 312px; right: 14px; bottom: 0; height: 50px; display: flex; align-items: center; gap: 18px; font-size: 12.5px; color: var(--p-blei); white-space: nowrap; overflow: hidden; }
.p-sprech .mic { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 8px; border: 1px solid var(--p-tusche); border-radius: 15px; color: var(--p-tusche); background: #fff; }
.p-sprech .mic i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--p-rot); color: #fff; }
.p-sprech q { color: var(--p-rot); font-style: italic; quotes: "„" "“"; }
.p-sprech .agent { color: var(--p-blau); }

/* Reißbrett: schmal, Start, Tasten */
.r-reiss .desk { background: linear-gradient(160deg, #e6e9ec, #d3d8dd); }
.r-reiss .chat { background: #fbfbfc; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .14), 0 18px 46px rgba(30, 40, 50, .16); color: #1f2328; }
.r-reiss .chat-kopf { border-bottom: 1px solid #e7e9ec; }
.r-reiss .chat-du { background: #eceef1; }
.r-reiss .chat-er { color: #2a2f35; }
.r-reiss .chat-eingabe { background: #fff; box-shadow: inset 0 0 0 1px #dfe2e6; color: #8b9097; }
.r-reiss .schmal { background: var(--p-papier); box-shadow: 0 0 0 .5px rgba(0, 0, 0, .16), 0 18px 46px rgba(30, 40, 50, .2); }
.schmal .p-kopf { gap: 14px; padding: 0 12px 0 16px; }
.schmal .p-blatt { left: 10px; right: 10px; }
.schmal .p-rand { inset: 10px; }
.p-schmal-unten { position: absolute; left: 24px; right: 24px; bottom: 24px; z-index: 4; background: #fff; }
.p-start { position: absolute; left: 0; right: 0; top: 250px; text-align: center; z-index: 4; }
.p-start h2 { margin: 0; font-size: 32px; font-weight: 400; letter-spacing: -.015em; }
.p-start p { margin: 10px 0 0; color: var(--p-blei); font-size: 14.5px; }
.p-schublade { position: absolute; right: 14px; top: 48px; bottom: 46px; width: 452px; background: #fbfbfc; box-shadow: -1px 0 0 var(--p-tusche), -18px 0 40px rgba(22, 32, 43, .12); z-index: 8; padding: 22px 24px 18px 40px; display: flex; flex-direction: column; }
.p-griff { position: absolute; left: -1px; top: 50%; transform: translate(-100%, -50%); width: 26px; height: 148px; background: #fbfbfc; border: 1px solid var(--p-tusche); border-right: 0; border-radius: 6px 0 0 6px; display: flex; align-items: center; justify-content: center; }
.p-griff span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11.5px; color: var(--p-blei); letter-spacing: .01em; display: flex; gap: 8px; align-items: center; }
.p-schublade h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.p-schublade > p { margin: 0 0 16px; color: var(--p-blei); font-size: 12.5px; }
.p-mappe { display: grid; grid-template-columns: 150px 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid var(--p-linie); align-items: center; }
.p-mappe .vp { position: relative; height: 112px; background: #fff; box-shadow: 0 0 0 1px var(--p-tusche); }
.p-mappe b { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 3px; }
.p-mappe small { display: block; color: var(--p-blei); font-size: 12px; }
.p-mappe code { display: block; margin-top: 6px; font: 10.5px var(--mono); color: var(--p-blei2); }
.p-mappe.zuletzt b { color: var(--p-rot); }
.p-schublade footer { margin-top: auto; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--p-blei); }
.p-schublade footer span.knopf { height: 30px; padding: 0 12px; border: 1px solid var(--p-tusche); border-radius: 3px; display: inline-flex; align-items: center; color: var(--p-tusche); background: #fff; }
.p-schleier { position: absolute; inset: 0; background: rgba(236, 239, 242, .7); z-index: 7; }
.p-legendblatt { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); width: 1080px; height: 690px; background: #fff; box-shadow: 0 0 0 1px rgba(22, 32, 43, .12), 0 30px 70px rgba(22, 32, 43, .18); z-index: 8; padding: 40px 46px; }
.p-legendblatt .p-rand { inset: 16px; }
.p-legendblatt h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.p-legendblatt > p { margin: 4px 0 22px; color: var(--p-blei); font-size: 13px; }
.p-legspalten { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 36px; }
.p-leggruppe { margin-bottom: 18px; }
.p-leggruppe h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; padding-bottom: 4px; border-bottom: 1.4px solid var(--p-tusche); }
.p-leggruppe.agent h4 { color: var(--p-rot); border-color: var(--p-rot); }
.p-leggruppe dl { margin: 0; display: grid; grid-template-columns: 112px 1fr; font-size: 12.5px; }
.p-leggruppe dt, .p-leggruppe dd { margin: 0; height: 27px; display: flex; align-items: center; border-bottom: 1px solid var(--p-linie); }
.p-leggruppe dd { color: var(--p-tusche); }
.p-legendblatt .p-schriftfeld { right: 16px; bottom: 16px; }

/* ==========================================================================
   Richtung Sucher: Der Viewer als Kameramonitor. Spricht Kevin, geht das Bild
   auf Sendung (Tally-Rahmen). Der Agent schreibt mit Timecode in Cyan, Befunde
   zeigen Zebra. Die Werkstatt ist ein Multiviewer.
   ========================================================================== */
.r-sucher {

/* ==========================================================================

const KC = (() => {

  function zeichnung(box, scene, opt = {}) {
    const W = box.clientWidth, H = box.clientHeight;
    const [lo, hi] = scene.bbox;
    const vorn = { w: hi[0] - lo[0], h: hi[2] - lo[2] }, seite = { w: hi[1] - lo[1], h: hi[2] - lo[2] };
    const L = opt.links ?? 58, R = opt.rechts ?? 22, O = opt.oben ?? 30, U = opt.unten ?? 46, gap = opt.gap ?? 84;
    const s = Math.min((W - L - R - gap) / (vorn.w + seite.w), (H - O - U) / vorn.h);
    const pad = 6;
    const hV = vorn.h * s, xV = L, yV = O + (H - O - U - hV) / 2;

      for (const x of [210, -270]) mitte(V([x, 0, 50]), 50 * s + 5);

  // OSD-Maß: Linie mit Querstrichen, Wert im schwarzen Kasten
  function osd(o, a, b, text, farbe = F.agent) {
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, nx = -dy / l * 6, ny = dx / l * 6;
    o.el('path', { d: `M${G.pt(a)} L${G.pt(b)} M${G.pt([a[0] - nx, a[1] - ny])} L${G.pt([a[0] + nx, a[1] + ny])} M${G.pt([b[0] - nx, b[1] - ny])} L${G.pt([b[0] + nx, b[1] + ny])}`, stroke: farbe, 'stroke-width': 1.2, fill: 'none' });
    return o.marke((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, text, 's-osd');
  }
  function fokusbox(o, x, y, w, h, farbe) {
    const c = 9, d = [];
    for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      const X = x + sx * w, Y = y + sy * h;
      d.push(`M${G.f1(X)} ${G.f1(Y - sy * c)} L${G.f1(X)} ${G.f1(Y)} L${G.f1(X - sx * c)} ${G.f1(Y)}`);
    }
    o.el('path', { d: d.join(' '), stroke: farbe, 'stroke-width': 2, fill: 'none' });
  }

        const z = G.zeigespur(o, p, F.kevin, { r: 1.5 });

(() => {
  'use strict';
  const RICHTUNGEN = {
    graphit: { name: 'Graphit', mod: GRAPHIT, cls: 'r-graphit', kurz: 'Der Viewer als Fotostudio',
      idee: '<b>Graphit.</b> Der Viewer wird zum Fotostudio, die Oberfläche tritt zurück. Im Fokus steht Text direkt im Bild, Tafeln gibt es erst in der Werkstatt. Was du sagst und zeigst, erscheint in Lichtblau, was der Agent tut, in Messing.' },

  };

  const q = new URLSearchParams(location.search);

  const lesen = () => {
    const [r, z] = (location.hash.slice(1) || '').split('/');

  };

  function rendern(buehne, scr, skala) {
    const dpr = Math.max(1, (window.devicePixelRatio || 1) * skala);

      res[v.id] = { el, project: r.project, w, h, scene };
    }
    for (const z of scr.zeichnungen || []) {
      const box = buehne.querySelector(`[data-z="${z.id}"]`); if (!box) continue;
      const zz = G.zeichnung(box, G.szene(z.scene), z.opt || {});
      const rr = zz.ansichten.map(a => KC.render(a.scene, { w: a.el.clientWidth, h: a.el.clientHeight, dpr, cam: a.cam, fit: a.fit, style: a.style }, a.el.querySelector('canvas')));
      zz.nachher(rr[0], rr[1]);
    }
    if (scr.after) scr.after(res, buehne);
    if (!KC.init()) {
      const n = document.createElement('div'); n.className = 'ohne-webgl';
      n.textContent = 'Das 3D-Modell braucht WebGL 2. Dieser Browser bietet es nicht an, deshalb bleibt die Bildfläche leer.';
      buehne.appendChild(n);
    }
  }
  function zeigen(buehne, r, z, skala) {
    const R = RICHTUNGEN[r], scr = R.mod[z]();
    buehne.className = `buehne ${R.cls} z-${z}${STILL ? ' still' : ''}`;
    buehne.setAttribute('aria-label', `Entwurf ${R.name}, ${ZUSTAENDE.find(e => e[0] === z)[1]}`);
    buehne.innerHTML = scr.html;
    rendern(buehne, scr, skala);
  }

  const halter = document.getElementById('halter'), buehne = document.getElementById('buehne');
  function skala() {
    if (BILD) return 1;
    const el = halter.parentElement, cs = getComputedStyle(el);
    const verf = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    return Math.min(1, verf / 1440);
  }
  function aktualisieren() {
    const { r, z } = lesen(), s = skala();
    if (!BILD) {
      halter.style.width = (1440 * s) + 'px'; halter.style.height = (900 * s) + 'px';
      buehne.style.transform = `scale(${s})`;
    }
    zeigen(buehne, r, z, s);
    document.querySelectorAll('[data-richtung]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.richtung === r)));
    document.querySelectorAll('[data-zustand]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.zustand === z)));
    document.getElementById('idee').innerHTML = RICHTUNGEN[r].idee;
    window.__fertig = true;
  }
  function setze(r, z) { const a = lesen(); location.hash = `${r || a.r}/${z || a.z}`; }

  // Umschalter
  const rs = document.getElementById('richtungen'), zs = document.getElementById('zustaende');
  for (const [k, R] of Object.entries(RICHTUNGEN)) {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.richtung = k; b.textContent = R.name;
    b.addEventListener('click', () => setze(k, null)); rs.appendChild(b);
  }
  for (const [k, name] of ZUSTAENDE) {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.zustand = k; b.textContent = `${k}  ${name}`;
    b.addEventListener('click', () => setze(null, k)); zs.appendChild(b);
  }
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const keys = Object.keys(RICHTUNGEN), { r, z } = lesen();
    if (['1', '2', '3'].includes(e.key)) setze(keys[+e.key - 1], null);
    else if (ZUSTAENDE.some(x => x[0] === e.key)) setze(null, e.key);
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      const i = ZUSTAENDE.findIndex(x => x[0] === z), n = ZUSTAENDE.length;
      setze(null, ZUSTAENDE[(i + (e.key === 'ArrowRight' ? 1 : n - 1)) % n][0]);
    }
  });
  window.addEventListener('hashchange', aktualisieren);
  let t = 0;
  window.addEventListener('resize', () => { if (BILD || UEB) return; clearTimeout(t); t = setTimeout(aktualisieren, 180); });

  if (UEB) {
    document.body.classList.add('zeige-uebersicht');
    const box = document.getElementById('uebersicht'), z = q.get('uebersicht') || 'a';
    for (const [k, R] of Object.entries(RICHTUNGEN)) {
      const fig = document.createElement('figure');
      fig.innerHTML = `<figcaption>${R.name}<span>${R.kurz}</span></figcaption><div class="zelle"><div class="buehne"></div></div>`;
      box.appendChild(fig);
      zeigen(fig.querySelector('.buehne'), k, ZUSTAENDE.some(e => e[0] === z) ? z : 'a', 0.5);
    }
    window.__fertig = true;
  } else {
    if (BILD) document.body.classList.add('nur-buehne');
    aktualisieren();
  }
})();

</script>
